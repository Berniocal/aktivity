<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Aktivity</title>
<style>
  :root{
    --bg:#eef7f0;
    --bg2:#dff1e4;
    --panel:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#d8e3dc;
    --accent:#16a34a;
    --accent-dark:#15803d;
    --danger:#dc2626;
    --shadow:0 18px 45px rgba(15,23,42,0.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:760px;
    min-height:100vh;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  h1{
    margin:2px 0 0;
    text-align:center;
    font-size:clamp(30px,6vw,44px);
    line-height:1;
    letter-spacing:0;
  }
  .screen{
    background:var(--panel);
    border:1px solid rgba(216,227,220,0.9);
    border-radius:18px;
    padding:16px;
    box-shadow:var(--shadow);
  }
  .hidden{display:none!important}
  .section-title{
    margin:0 0 10px;
    color:var(--muted);
    font-size:13px;
    font-weight:800;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  #teamsContainer{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .game-type-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
    margin-bottom:12px;
  }
  .btn-type{
    min-height:74px;
    flex-direction:column;
    background:#f8fafc;
    border:1px solid var(--line);
    text-align:center;
  }
  .btn-type span{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
  }
  .game-help{
    min-height:44px;
    padding:11px 12px;
    margin:0 0 16px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#f8fafc;
    color:var(--muted);
    font-size:14px;
    font-weight:700;
  }
  .team-row{
    display:flex;
    gap:8px;
  }
  .team-row input{
    flex:1;
    min-width:0;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#f9fafb;
    font-size:16px;
    outline:none;
  }
  .team-row input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(22,163,74,0.14);
  }
  .btn-remove-team{
    width:46px;
    flex:0 0 46px;
    padding:0;
    font-size:20px;
    background:#fee2e2;
    color:#991b1b;
  }
  .btn{
    border:0;
    border-radius:12px;
    padding:11px 15px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    background:#f3f4f6;
    color:var(--ink);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:transform 0.12s,box-shadow 0.12s,background 0.12s;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{
    background:var(--accent);
    color:white;
    box-shadow:0 8px 18px rgba(22,163,74,0.24);
  }
  .btn-primary:active{background:var(--accent-dark)}
  .btn-secondary{
    background:#eef2f7;
  }
  .btn:disabled{
    opacity:0.45;
    cursor:default;
    transform:none;
    box-shadow:none;
  }
  .setup-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .top-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .timer-pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#111827;
    color:#fff;
    padding:6px 12px;
    border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .timer-input{
    width:4em;
    border:0;
    background:transparent;
    color:inherit;
    text-align:center;
    font-size:20px;
    font-weight:900;
    outline:none;
  }
  .turn-info{
    margin:0 0 16px;
    text-align:center;
    font-size:24px;
    font-weight:900;
  }
  .mode-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }
  .limit-panel{
    margin:0 0 12px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#f8fafc;
  }
  .limit-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }
  .limit-field{
    display:flex;
    flex-direction:column;
    gap:6px;
    color:var(--muted);
    font-size:12px;
    font-weight:800;
  }
  .limit-field input{
    width:100%;
    padding:10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    font-size:18px;
    font-weight:900;
    text-align:center;
  }
  .word-entry-title{
    margin:0 0 14px;
    text-align:center;
    font-size:24px;
    font-weight:950;
  }
  .entry-field{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-bottom:12px;
  }
  .entry-label{
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:var(--muted);
    font-size:13px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .entry-count{
    color:var(--accent-dark);
    font-variant-numeric:tabular-nums;
  }
  .entry-field textarea{
    width:100%;
    min-height:86px;
    resize:vertical;
    padding:12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#f9fafb;
    color:var(--ink);
    font:inherit;
    outline:none;
  }
  .entry-field textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(22,163,74,0.14);
  }
  .custom-game-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
    margin:12px 0;
  }
  .word-entry-actions{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-top:12px;
  }
  .btn-mode{
    min-height:92px;
    padding:14px 10px;
    flex-direction:column;
    background:#f8fafc;
    border:1px solid var(--line);
    font-size:16px;
  }
  .btn-mode span{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
  }
  .btn-choice-active{
    background:#dcfce7;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(22,163,74,0.16);
  }
  .choice-hint{
    color:var(--muted);
    font-size:13px;
    margin:10px 0 0;
  }
  .word-wrapper{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .word-card{
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 18px;
    background:linear-gradient(180deg,#ffffff,#f8fafc);
  }
  .word-text{
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:clamp(30px,8vw,54px);
    line-height:1.05;
    font-weight:950;
    overflow-wrap:anywhere;
  }
  #btnStartTurn{
    width:100%;
    margin-top:12px;
  }
  .result-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .btn-success{
    background:var(--accent);
    color:white;
  }
  .btn-danger{
    background:#fee2e2;
    color:#991b1b;
  }
  .small-text{
    min-height:20px;
    margin-top:10px;
    color:var(--muted);
    text-align:center;
    font-size:14px;
    font-weight:700;
  }
  .results-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0 8px;
    margin:4px 0 14px;
  }
  .results-table th{
    color:var(--muted);
    font-size:12px;
    text-align:left;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:0 10px;
  }
  .results-table td{
    background:#f8fafc;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:12px 10px;
    font-weight:800;
  }
  .results-table td:first-child{
    border-left:1px solid var(--line);
    border-radius:12px 0 0 12px;
  }
  .results-table td:last-child{
    border-right:1px solid var(--line);
    border-radius:0 12px 12px 0;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .results-table tr.next td{
    background:#f0fdf4;
    border-color:rgba(22,163,74,0.45);
  }
  #btnContinueRound{
    width:100%;
  }
  @media (max-width:620px){
    .app{padding:12px}
    .screen{padding:14px;border-radius:16px}
    .setup-actions,.mode-grid,.result-buttons,.game-type-grid,.custom-game-grid{grid-template-columns:1fr}
    .limit-grid{grid-template-columns:1fr 1fr 1fr}
    .btn-mode{min-height:70px}
    .word-text{min-height:130px}
  }
</style>
</head>
<body>
<div class="app">
  <h1>Aktivity</h1>

  <div id="setupScreen" class="screen">
    <p class="section-title">Typ hry</p>
    <div class="game-type-grid" id="gameTypeButtons">
      <button class="btn btn-type" data-game-type="classic">Klasika<span>1 pojem za tah</span></button>
      <button class="btn btn-type" data-game-type="timed">Na čas<span>víc pojmů v tahu</span></button>
      <button class="btn btn-type" data-game-type="mixed">Mix limitů<span>čas + počty kategorií</span></button>
      <button class="btn btn-type" data-game-type="custom">Vlastní pojmy<span>týmy napíšou slova</span></button>
    </div>
    <p id="gameTypeHelp" class="game-help">Vyber typ hry.</p>

    <p class="section-title">Týmy</p>
    <div id="teamsContainer"></div>
    <div class="setup-actions">
      <button id="btnAddTeam" class="btn btn-secondary">Přidat tým</button>
      <button id="btnStartGame" class="btn btn-primary" disabled>Start hry</button>
    </div>
  </div>

  <div id="wordSetupScreen" class="screen hidden">
    <p class="section-title">Vlastní pojmy</p>
    <h2 id="wordSetupTeamName" class="word-entry-title"></h2>

    <label class="entry-field">
      <span class="entry-label">Kreslení <span id="customDrawCount" class="entry-count">0</span></span>
      <textarea id="customDrawInput" placeholder="strom, auto, hrad"></textarea>
    </label>

    <label class="entry-field">
      <span class="entry-label">Pantomima <span id="customActCount" class="entry-count">0</span></span>
      <textarea id="customActInput" placeholder="kuchař, zedník, brusle"></textarea>
    </label>

    <label class="entry-field">
      <span class="entry-label">Vysvětlování <span id="customExplainCount" class="entry-count">0</span></span>
      <textarea id="customExplainInput" placeholder="dovolená, tajemství, reklamace"></textarea>
    </label>

    <div id="customGameChoice" class="hidden">
      <p class="section-title">Jak budete hrát?</p>
      <div class="custom-game-grid" id="customGameTypeButtons">
        <button class="btn btn-type" data-game-type="classic">Klasika<span>1 pojem za tah</span></button>
        <button class="btn btn-type" data-game-type="timed">Na čas<span>víc pojmů v tahu</span></button>
        <button class="btn btn-type" data-game-type="mixed">Mix limitů<span>čas + limit jedné kategorie</span></button>
      </div>
    </div>

    <div class="word-entry-actions">
      <button id="btnNextWordTeam" class="btn btn-primary">Další tým</button>
    </div>
  </div>

  <div id="gameScreen" class="screen hidden">
    <div class="top-row">
      <div class="timer-pill">
        <input id="timerInput" class="timer-input" type="text" value="1:00" />
      </div>
    </div>

    <div id="selectView">
      <p class="turn-info">Na tahu: <span id="currentTeamName"></span></p>
      <div id="limitPanel" class="limit-panel hidden">
        <p class="section-title">Maximum v tahu</p>
        <div class="limit-grid">
          <label class="limit-field">Kreslení
            <input id="drawLimitInput" type="number" min="0" max="20" value="2" />
          </label>
          <label class="limit-field">Pantomima
            <input id="actLimitInput" type="number" min="0" max="20" value="2" />
          </label>
          <label class="limit-field">Pojmy
            <input id="explainLimitInput" type="number" min="0" max="20" value="4" />
          </label>
        </div>
      </div>
      <div class="mode-grid" id="modeButtons">
        <button class="btn btn-mode" data-mode="draw">Kreslení<span id="drawModeHint">kresli bez mluvení</span></button>
        <button class="btn btn-mode" data-mode="act">Pantomima<span id="actModeHint">předváděj beze slov</span></button>
        <button class="btn btn-mode" data-mode="explain">Vysvětlování<span id="explainModeHint">popisuj bez kořene slova</span></button>
      </div>
    </div>

    <div id="turnView" class="hidden">
      <div class="word-wrapper">
        <div class="word-card">
          <div id="currentWord" class="word-text"></div>
        </div>
      </div>

      <button id="btnStartTurn" class="btn btn-primary">Start</button>

      <div id="resultButtons" class="result-buttons hidden">
        <button id="btnGuessed" class="btn btn-success">Uhodli</button>
        <button id="btnNotGuessed" class="btn btn-danger">Neuhodli</button>
      </div>
      <div id="infoText" class="small-text"></div>
    </div>

    <div id="scoreView" class="hidden">
      <p class="section-title">Výsledky</p>
      <table class="results-table">
        <thead>
          <tr>
            <th>Tým</th>
            <th>Body</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
      <button id="btnContinueRound" class="btn btn-primary">Pokračovat</button>
    </div>
  </div>
</div>

  let audioContext = null;
  function playEndSound(){
    try{
      if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      const now = audioContext.currentTime;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.linearRampToValueAtTime(600, now + 0.5);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.9);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(now);
      osc.stop(now + 0.9);
    }catch(e){}
  }

  function addTeamRow(initialName = ""){
    const row = document.createElement("div");
    row.className = "team-row";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Název týmu";
    input.value = initialName;
    input.addEventListener("input", validateStartButton);
    const removeButton = document.createElement("button");
    removeButton.type = "button";
    removeButton.className = "btn btn-remove-team";
    removeButton.textContent = "×";
    removeButton.setAttribute("aria-label", "Odebrat tým");
    removeButton.addEventListener("click", () => {
      row.remove();
      validateStartButton();
    });
    row.appendChild(input);
    row.appendChild(removeButton);
    teamsContainer.appendChild(row);
    updateRemoveButtons();
  }

  function getTeamNames(){
    return [...teamsContainer.querySelectorAll("input")]
      .map(input => input.value.trim())
      .filter(Boolean);
  }

  function validateStartButton(){
    btnStartGame.disabled = getTeamNames().length < 2 || (!gameType && !customWordsMode);
    btnStartGame.textContent = customWordsMode ? "Zadat pojmy" : "Start hry";
    updateRemoveButtons();
  }

  function updateRemoveButtons(){
    const rows = [...teamsContainer.querySelectorAll(".team-row")];
    rows.forEach(row => {
      const button = row.querySelector(".btn-remove-team");
      if(button) button.disabled = rows.length <= 2;
    });
  }

  function startGame(){
    const names = getTeamNames();
    if(!gameType && !customWordsMode){
      alert("Vyber typ hry.");
      return;
    }
    if(names.length < 2){
      alert("Zadej alespoň dva týmy.");
      return;
    }
    teams = names.map(name => ({ name, score:0 }));
    if(customWordsMode){
      startCustomWordEntry();
      return;
    }
    wordPool = createBuiltInWordPool();
    beginPlay();
  }

  function beginPlay(){
    currentTeamIndex = 0;
    usedWords = new Set();
    setupScreen.classList.add("hidden");
    wordSetupScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    updateCurrentTeamLabel();
    resetForNewTurn();
  }

  function createBuiltInWordPool(){
    return {
      draw:WORDS.draw.map(text => ({ text, ownerIndex:null })),
      act:WORDS.act.map(text => ({ text, ownerIndex:null })),
      explain:WORDS.explain.map(text => ({ text, ownerIndex:null }))
    };
  }

  function startCustomWordEntry(){
    customEntryIndex = 0;
    customWordEntries = teams.map(() => ({ draw:[], act:[], explain:[] }));
    setupScreen.classList.add("hidden");
    wordSetupScreen.classList.remove("hidden");
    showCustomEntryTeam();
  }

  function parseCustomWords(text){
    const seen = new Set();
    return String(text || "")
      .split(",")
      .map(word => word.trim())
      .filter(Boolean)
      .filter(word => {
        const key = normalizeWord(word);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
  }

  function updateCustomCounts(){
    customDrawCount.textContent = parseCustomWords(customDrawInput.value).length;
    customActCount.textContent = parseCustomWords(customActInput.value).length;
    customExplainCount.textContent = parseCustomWords(customExplainInput.value).length;
  }

  function saveCurrentCustomEntry(){
    customWordEntries[customEntryIndex] = {
      draw:parseCustomWords(customDrawInput.value),
      act:parseCustomWords(customActInput.value),
      explain:parseCustomWords(customExplainInput.value)
    };
    try{
      localStorage.setItem("aktivityCustomWords", JSON.stringify({
        savedAt:new Date().toISOString(),
        teams:teams.map(team => team.name),
        entries:customWordEntries
      }));
    }catch(e){}
  }

  function showCustomEntryTeam(){
    const entry = customWordEntries[customEntryIndex] || { draw:[], act:[], explain:[] };
    const isLastTeam = customEntryIndex === teams.length - 1;
    wordSetupTeamName.textContent = teams[customEntryIndex].name;
    customDrawInput.value = entry.draw.join(", ");
    customActInput.value = entry.act.join(", ");
    customExplainInput.value = entry.explain.join(", ");
    customGameChoice.classList.toggle("hidden", !isLastTeam);
    btnNextWordTeam.textContent = isLastTeam ? "Start hry" : "Další tým";
    updateCustomCounts();
  }

  function createCustomWordPool(){
    return {
      draw:[],
      act:[],
      explain:[]
    };
  }

  function buildCustomWordPool(){
    const pool = createCustomWordPool();
    customWordEntries.forEach((entry, ownerIndex) => {
      ["draw", "act", "explain"].forEach(mode => {
        entry[mode].forEach(text => pool[mode].push({ text, ownerIndex }));
      });
    });
    return pool;
  }

  function continueCustomWordEntry(){
    saveCurrentCustomEntry();
    if(customEntryIndex < teams.length - 1){
      customEntryIndex += 1;
      showCustomEntryTeam();
      return;
    }
    if(!gameType){
      alert("Vyber, jak budete hrát.");
      return;
    }
    wordPool = buildCustomWordPool();
    if(!wordPool.draw.length && !wordPool.act.length && !wordPool.explain.length){
      alert("Nejdřív napište aspoň nějaké pojmy.");
      return;
    }
    teams.forEach(team => { team.score = 0; });
    beginPlay();
  }

  function resetForNewTurn(){
    selectedMode = null;
    wordPrepared = false;
    roundRunning = false;
    currentTurnStarted = false;
    mixedRemaining = { draw:0, act:0, explain:0 };
    stopTimer();
    timerInput.disabled = false;
    setTimerDisplay(baseDuration);
    infoText.textContent = "";
    resultButtons.classList.add("hidden");
    btnStartTurn.classList.remove("hidden");
    [...modeButtonsWrap.querySelectorAll("button")].forEach(btn => btn.classList.remove("btn-choice-active"));
    showSelectView();

  function shuffle(items){
    const arr = [...items];
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function normalizeWord(word){
    return String(word).trim().toLowerCase();
  }

  function availableWords(mode){
    const pool = wordPool || createBuiltInWordPool();
    return pool[mode].filter(item => {
      const key = normalizeWord(item.text);
      const ownWord = item.ownerIndex !== null && item.ownerIndex === currentTeamIndex;
      return !usedWords.has(key) && !ownWord;
    });
  }

  function pickWord(mode){
    const available = availableWords(mode);
    if(available.length === 0) return null;
    const item = available[Math.floor(Math.random() * available.length)];
    usedWords.add(normalizeWord(item.text));
    return item.text;
  }

  function readLimit(input){
    const value = parseInt(input.value, 10);
    if(isNaN(value)) return 0;
    return Math.max(0, Math.min(20, value));
  }

  function readMixedLimits(){
    return {
      draw:readLimit(drawLimitInput),
      act:readLimit(actLimitInput),
      explain:readLimit(explainLimitInput)
    };
  }

  function totalMixedRemaining(){
    return mixedRemaining.draw + mixedRemaining.act + mixedRemaining.explain;
  }

  function hasPlayableMode(){
    return ["draw", "act", "explain"].some(mode => availableWords(mode).length > 0 && getModeLimit(mode) > 0);
  }

  function setupMixedTurnIfNeeded(){
    if(gameType !== "mixed" || currentTurnStarted) return;
    mixedRemaining = readMixedLimits();
  }

  function getModeLimit(mode){
    if(gameType !== "mixed") return Infinity;
    if(currentTurnStarted || wordPrepared) return mixedRemaining[mode];
    return readMixedLimits()[mode];
  }

  function updateLimitControls(){
    const isMixed = gameType === "mixed";
    limitPanel.classList.toggle("hidden", !isMixed);
    [drawLimitInput, actLimitInput, explainLimitInput].forEach(input => {
      input.disabled = isMixed && (currentTurnStarted || wordPrepared);
    });
  }

  function updateModeButtons(){
    const hintEls = { draw:drawModeHint, act:actModeHint, explain:explainModeHint };
    [...modeButtonsWrap.querySelectorAll("button")].forEach(button => {
      const mode = button.dataset.mode;
      const freeWords = availableWords(mode).length;
      const limit = getModeLimit(mode);
      const disabled = freeWords === 0 || limit <= 0;
      button.disabled = disabled;
      if(gameType === "mixed"){
        hintEls[mode].textContent = currentTurnStarted || wordPrepared
          ? "zbývá " + Math.max(0, limit)
          : "max " + Math.max(0, limit);
      }else if(gameType === "timed"){
        hintEls[mode].textContent = "víc pojmů v jednom čase";
      }else{
        hintEls[mode].textContent = MODE_HINTS[mode];
      }
    });
  }

  function prepareRound(){
    setupMixedTurnIfNeeded();
    if(gameType === "mixed"){
      if(mixedRemaining[selectedMode] <= 0){
        infoText.textContent = "Tahle kategorie už má vyčerpaný limit.";
        updateModeButtons();
        if(currentTurnStarted && !hasPlayableMode()) finishTurn();
        return;
      }
      mixedRemaining[selectedMode] -= 1;
    }

    const word = pickWord(selectedMode);
    if(!word){
      infoText.textContent = "V této kategorii došly pojmy.";
      updateModeButtons();
      if(currentTurnStarted && gameType !== "classic") finishTurn();
      return;
    }

    currentWordEl.textContent = word;
    resultButtons.classList.add("hidden");
    btnStartTurn.classList.remove("hidden");
    infoText.textContent = "";
    timerInput.disabled = false;
    wordPrepared = true;
    roundRunning = false;
    stopTimer();
    updateLimitControls();
    if(currentTurnStarted && gameType !== "classic"){
      btnStartTurn.classList.add("hidden");
      resultButtons.classList.remove("hidden");
      timerInput.disabled = true;
      roundRunning = true;
      startTimer();
    }
    showTurnView();
  }

  function handleResult(guessed){
    if(!wordPrepared) return;

    const team = teams[currentTeamIndex];
    if(guessed){
      team.score += 1;
    }else if(gameType !== "classic"){
      team.score -= 1;
    }

    wordPrepared = false;

    if(gameType === "classic"){
      finishTurn();
      return;
    }

    if(timeLeft <= 0 || !roundRunning){
      finishTurn();
      return;
    }

    if(gameType === "timed"){
      prepareRound();
      return;
    }

    if(gameType === "mixed"){
      if(mixedRemaining[selectedMode] <= 0){
        finishTurn();
        return;
      }
      prepareRound();
      return;
    }

    if(totalMixedRemaining() <= 0){
      finishTurn();
      return;
    }

    selectedMode = null;
    [...modeButtonsWrap.querySelectorAll("button")].forEach(btn => btn.classList.remove("btn-choice-active"));
    resultButtons.classList.add("hidden");
    btnStartTurn.classList.add("hidden");
    showSelectView();
    if(!hasPlayableMode()) finishTurn();
  }

  function finishTurn(){
    stopTimer();
    roundRunning = false;
    currentTurnStarted = false;
    wordPrepared = false;
    timerInput.disabled = false;
    renderResults();
    showScoreView();
  }

  function renderResults(){
    const nextTeamIndex = (currentTeamIndex + 1) % teams.length;
    resultsBody.innerHTML = "";
    [...teams]
      .sort((a, b) => b.score - a.score || teams.indexOf(a) - teams.indexOf(b))
      .forEach(team => {
        const originalIndex = teams.indexOf(team);
        const row = document.createElement("tr");
        if(originalIndex === nextTeamIndex) row.className = "next";
        row.innerHTML = `<td></td><td></td>`;
        row.children[0].textContent = team.name;
        row.children[1].textContent = team.score + " b";
        resultsBody.appendChild(row);
      });
  }

  function continueToNextRound(){
    currentTeamIndex = (currentTeamIndex + 1) % teams.length;
    updateCurrentTeamLabel();
    resetForNewTurn();
  }

  function parseTimerValue(str){
    str = String(str || "").trim();
    if(!str) return 60;
    if(str.includes(":")){
      const [mPart,sPart] = str.split(":");
      const m = parseInt(mPart,10);
      const s = parseInt(sPart,10);
      if(isNaN(m) || isNaN(s)) return 60;
      return Math.max(1, m * 60 + s);
    }
    const sec = parseInt(str,10);
    return isNaN(sec) || sec <= 0 ? 60 : sec;
  }

  function formatTime(sec){
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ":" + (s < 10 ? "0" + s : s);
  }

  function setTimerDisplay(sec){
    timerInput.value = formatTime(sec);
  }

  function startTimerFromInput(){
    baseDuration = parseTimerValue(timerInput.value);
    timeLeft = baseDuration;
    setTimerDisplay(timeLeft);
    timerInput.disabled = true;
    currentTurnStarted = true;
    updateLimitControls();
    startTimer();
  }

  function startTimer(){
    stopTimer();
    roundRunning = true;
    if(!audioContext){
      try{
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }catch(e){
        audioContext = null;
      }
    }
    timerId = setInterval(() => {
      timeLeft--;
      setTimerDisplay(timeLeft);
      if(timeLeft <= 0){
        stopTimer();
        roundRunning = false;
        playEndSound();
        timerInput.disabled = false;
        if(gameType === "classic"){
          infoText.textContent = "Čas vypršel";
        }else{
          finishTurn();
        }
      }
    }, 1000);
  }

  function stopTimer(){
    if(timerId){
      clearInterval(timerId);
      timerId = null;
    }
  }

  gameTypeButtons.addEventListener("click", event => {
    const button = event.target.closest("button");
    if(!button) return;
    customWordsMode = button.dataset.gameType === "custom";
    gameType = customWordsMode ? null : button.dataset.gameType;
    [...gameTypeButtons.querySelectorAll("button")]
      .forEach(btn => btn.classList.toggle("btn-choice-active", btn === button));
    [...customGameTypeButtons.querySelectorAll("button")]
      .forEach(btn => btn.classList.remove("btn-choice-active"));
    gameTypeHelp.textContent = GAME_TYPE_TEXTS[button.dataset.gameType];
    validateStartButton();
  });

  customGameTypeButtons.addEventListener("click", event => {
    const button = event.target.closest("button");
    if(!button) return;
    gameType = button.dataset.gameType;
    [...customGameTypeButtons.querySelectorAll("button")]
      .forEach(btn => btn.classList.toggle("btn-choice-active", btn === button));
  });

  btnAddTeam.addEventListener("click", () => addTeamRow(""));
  btnStartGame.addEventListener("click", startGame);
  btnNextWordTeam.addEventListener("click", continueCustomWordEntry);

  [customDrawInput, customActInput, customExplainInput].forEach(input => {
    input.addEventListener("input", updateCustomCounts);
  });

  modeButtonsWrap.addEventListener("click", event => {
    const button = event.target.closest("button");
    if(!button || button.disabled) return;
    selectedMode = button.dataset.mode;
    [...modeButtonsWrap.querySelectorAll("button")]
      .forEach(btn => btn.classList.toggle("btn-choice-active", btn === button));
    if(selectedMode && !wordPrepared) prepareRound();
  });

  btnStartTurn.addEventListener("click", () => {
    if(roundRunning) return;
    startTimerFromInput();
    btnStartTurn.classList.add("hidden");
    resultButtons.classList.remove("hidden");
    infoText.textContent = gameType === "classic" ? "Čas běží" : "Uhodli +1, neuhodli -1";
  });

  [drawLimitInput, actLimitInput, explainLimitInput].forEach(input => {
    input.addEventListener("input", updateModeButtons);
  });

  btnGuessed.addEventListener("click", () => handleResult(true));
  btnNotGuessed.addEventListener("click", () => handleResult(false));
  btnContinueRound.addEventListener("click", continueToNextRound);

  addTeamRow("Tým 1");
  addTeamRow("Tým 2");
  validateStartButton();
  setTimerDisplay(baseDuration);
</script>
</body>
</html>
